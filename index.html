<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS GRANTED</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            height: 100vh;
            width: 100vw;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.85;
        }

        .thanks-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff41;
            font-size: 1.1rem;
            text-shadow: 0 0 15px #00ff41;
            z-index: 15;
            letter-spacing: 3px;
            white-space: nowrap;
        }

        .terminal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 740px;
            z-index: 10;
            background: rgba(0, 10, 0, 0.92);
            padding: 20px 18px;
            border: 2px solid #00ff41;
            box-shadow: 0 0 40px #00ff41, inset 0 0 20px rgba(0, 255, 65, 0.2);
            border-radius: 6px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
            font-size: 1.35rem;
            text-shadow: 0 0 15px #00ff41;
            letter-spacing: 2px;
        }

        .line {
            margin: 7px 0;
            white-space: pre-wrap;
            word-break: break-all;
            opacity: 0;
            animation: fadeIn 0.6s forwards;
            font-size: 1.05rem;
            line-height: 1.4;
            text-shadow: 0 0 8px #00ff41;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 19px;
            background: #00ff41;
            vertical-align: middle;
            animation: blink 0.6s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .thanks-header {
                font-size: 1rem;
                top: 12px;
            }
            .terminal {
                padding: 16px 12px;
                width: 95%;
            }
            .header {
                font-size: 1.25rem;
            }
            .line {
                font-size: 1rem;
                margin: 6px 0;
            }
        }
    </style>
</head>
<body>

    <!-- Top Thanks Message -->
    <div class="thanks-header">THANKS FOR YOUR WISHING</div>

    <canvas id="matrix"></canvas>

    <div class="terminal">
        <div class="header">=== BIRTHDAY HACK INITIATED ===</div>
        <div id="lines"></div>
        <span class="cursor"></span>
    </div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/sfx/preview/2578/2578.wav" type="audio/wav">
        Your browser does not support the audio element.
    </audio>

    <script>
        // Background Music with better autoplay handling
        const music = document.getElementById('bgMusic');
        
        function playMusic() {
            music.volume = 0.45;
            music.play().catch(() => {
                // Fallback for mobile autoplay block
                document.body.addEventListener('touchstart', () => {
                    music.play();
                }, { once: true });
            });
        }

        // Start music when typing begins (better chance of autoplay)
        window.addEventListener('load', () => {
            setTimeout(playMusic, 600);
        });

        // Fast Matrix Rain
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        function resizeCanvas() {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        }
        resizeCanvas();

        const alphabet = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$@#';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = new Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.96) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(drawMatrix, 30);

        // Fast Auto Typing
        const linesContainer = document.getElementById('lines');
        const messages = [
            "$ initializing_birthday_thanks.exe",
            "[OK] Firewall breached by friend wishes",
            "$ Connecting to your device...",
            "[WARNING] Personal files detected!",
            "[HACKING] Scanning your photos, chats and memories...",
            "[PROGRESS] Accessing personal files... 🔥",
            "[OK] All files accessed successfully (ethical mode only 😉)",
            "[OK] Happiness buffer overflow detected",
            "[OK] Deploying success v25",           // ← Change your age here
            "Root access granted.",
            "",
            "Hacked by Thushann ❤️",
            "This year full admin privileges to success & fun",
            "— Your friendly neighborhood ethical hacker 🕶️"
        ];

        let index = 0;

        function typeLine() {
            if (index >= messages.length) return;

            const line = document.createElement('div');
            line.className = 'line';
            linesContainer.appendChild(line);

            let i = 0;
            const text = messages[index];
            const speed = 20;

            const interval = setInterval(() => {
                line.textContent += text.charAt(i);
                i++;
                if (i >= text.length) {
                    clearInterval(interval);
                    index++;
                    setTimeout(typeLine, 260);
                }
            }, speed);
        }

        // Start typing
        setTimeout(typeLine, 500);

        // Resize handler
        window.addEventListener('resize', () => {
            resizeCanvas();
            columns = Math.floor(canvas.width / fontSize);
            rainDrops = new Array(columns).fill(1);
        });
    </script>
</body>
</html>
