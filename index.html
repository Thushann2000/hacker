<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enomy-Finances Staff Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f6f8;color:#1a1a2e;min-height:100vh}
:root{
  --primary:#1a3a6b;--primary-light:#2557a7;--primary-pale:#e8f0fb;
  --success:#1a6b3a;--success-pale:#e8f8ef;
  --warn:#7a4f00;--warn-pale:#fff3dc;
  --danger:#8b1a1a;--danger-pale:#fdeaea;
  --border:#dde3ef;--muted:#6b7280;--surface:#fff;
  --radius:10px;--radius-sm:6px;
}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f2044 0%,#1a3a6b 50%,#2557a7 100%)}
.login-card{background:#fff;border-radius:18px;padding:40px 44px;width:420px;box-shadow:0 24px 60px rgba(0,0,0,0.25)}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand h1{font-size:22px;font-weight:700;color:var(--primary);letter-spacing:-0.5px}
.login-brand p{font-size:13px;color:var(--muted);margin-top:4px}
.role-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:24px;background:#f0f2f7;border-radius:8px;padding:4px}
.role-tab{text-align:center;padding:8px 4px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .2s}
.role-tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;letter-spacing:0.3px;text-transform:uppercase}
.form-field input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border .2s}
.form-field input:focus{border-color:var(--primary-light)}
.demo-hint{font-size:11px;color:var(--muted);background:#f8f9fc;border-radius:6px;padding:8px 12px;margin-bottom:18px;line-height:1.6}
.demo-hint strong{color:var(--primary)}
.btn-login{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-login:hover{background:var(--primary-light)}
.login-error{font-size:13px;color:var(--danger);text-align:center;margin-top:12px;display:none}

/* ── APP SHELL ── */
#app{display:none;height:100vh;flex-direction:row}
#app.visible{display:flex}
.sidebar{width:220px;background:var(--primary);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.12)}
.sidebar-brand .brand-name{font-size:14px;font-weight:700;color:#fff;letter-spacing:-0.3px}
.sidebar-brand .brand-role{font-size:11px;color:rgba(255,255,255,0.55);margin-top:3px}
.nav-group-label{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.8px;text-transform:uppercase;padding:16px 18px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.75);transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,0.13);color:#fff;border-left-color:#7eb3ff}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-footer{margin-top:auto;padding:16px 18px;border-top:1px solid rgba(255,255,255,0.1)}
.user-pill{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.user-info .uname{font-size:13px;font-weight:500;color:#fff}
.user-info .urole{font-size:11px;color:rgba(255,255,255,0.5)}
.btn-logout{margin-top:10px;width:100%;padding:7px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);border:none;border-radius:6px;font-size:12px;cursor:pointer;transition:background .2s}
.btn-logout:hover{background:rgba(255,255,255,0.2)}

/* ── MAIN ── */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:600;color:var(--primary);flex:1}
.topbar-time{font-size:12px;color:var(--muted);background:#f0f2f7;padding:4px 10px;border-radius:20px}
.content{flex:1;overflow-y:auto;padding:24px}

/* ── PAGES ── */
.page{display:none}
.page.active{display:block}
.page-header{margin-bottom:20px}
.page-header h2{font-size:20px;font-weight:700;color:var(--primary)}
.page-header p{font-size:13px;color:var(--muted);margin-top:3px}

/* ── CARDS & PANELS ── */
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
.panel-title{font-size:14px;font-weight:600;color:var(--primary);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.metric{background:#f8f9fc;border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.metric-value{font-size:26px;font-weight:700;color:var(--primary);margin:4px 0}
.metric-sub{font-size:12px}
.up{color:var(--success)}.down{color:var(--danger)}

/* ── FORMS ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.3px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;transition:border .2s;background:#fff}
.field input:focus,.field select:focus{border-color:var(--primary-light)}
.field textarea{resize:vertical;min-height:80px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.four-col{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── BUTTONS ── */
.btn{padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light)}
.btn-success{background:#1a6b3a;color:#fff}.btn-success:hover{background:#145e30}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}.btn-outline:hover{background:var(--primary-pale)}
.btn-danger{background:#8b1a1a;color:#fff}.btn-danger:hover{background:#7a1212}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-block{width:100%;justify-content:center}

/* ── RESULT BOX ── */
.result-box{background:#f8f9fc;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:14px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;border-bottom:1px solid #eee}
.result-row:last-child{border:none}
.result-label{color:var(--muted)}
.result-val{font-weight:600;color:var(--primary)}
.result-total-row{background:var(--primary-pale);border-radius:6px;padding:8px 12px;display:flex;justify-content:space-between;margin-top:8px}
.result-total-row .result-val{font-size:16px;color:var(--primary)}
.fee-val{color:var(--danger)}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f0f4fb;color:var(--primary);font-weight:600;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:0.3px}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:hover td{background:#fafbff}

/* ── PILLS / BADGES ── */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.pill-active{background:var(--success-pale);color:var(--success)}
.pill-pending{background:var(--warn-pale);color:var(--warn)}
.pill-review{background:var(--primary-pale);color:var(--primary-light)}
.pill-danger{background:var(--danger-pale);color:var(--danger)}

/* ── INVESTMENT CARDS ── */
.inv-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.inv-card{border:2px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s}
.inv-card:hover{border-color:var(--primary-light)}
.inv-card.selected{border-color:var(--primary);background:var(--primary-pale)}
.inv-card-name{font-size:13px;font-weight:700;color:var(--primary)}
.inv-card-detail{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}

/* ── ACTIVITY FEED ── */
.activity-feed{font-size:13px}
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.act-content{flex:1}
.act-content strong{color:var(--primary)}
.act-time{font-size:11px;color:var(--muted);flex-shrink:0}

/* ── CLIENT LIST ── */
.client-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.cav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.cinfo{flex:1}
.cname{font-weight:600;font-size:13px;color:var(--primary)}
.cdetail{font-size:12px;color:var(--muted)}
.cactions{display:flex;gap:6px}

/* ── QUOTE HISTORY ── */
.quote-card{background:#f8f9fc;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.quote-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.quote-type{font-weight:600;font-size:13px;color:var(--primary)}
.quote-date{font-size:12px;color:var(--muted)}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px 30px;width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:700;color:var(--primary)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}

/* ── ALERTS ── */
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;display:none}
.alert-error{background:var(--danger-pale);color:var(--danger);border:1px solid #f5c0c0}
.alert-success{background:var(--success-pale);color:var(--success);border:1px solid #b0e0c0}
.alert-info{background:var(--primary-pale);color:var(--primary-light);border:1px solid #c0d8f5}

/* ── RATES GRID ── */
.rates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.rate-card{background:#f0f4fb;border-radius:var(--radius-sm);padding:10px 12px}
.rate-pair{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px}
.rate-value{font-size:16px;font-weight:700;color:var(--primary);margin-top:2px}

/* ── PROFILE ── */
.profile-header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.profile-av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0}
.profile-name{font-size:20px;font-weight:700;color:var(--primary)}
.profile-role{font-size:13px;color:var(--muted);margin-top:2px}

/* ── RETURNS TABLE ── */
.rtbl th,.rtbl td{padding:8px 12px}
.rtbl .pos{color:var(--success)}.rtbl .neg{color:var(--danger)}

/* ── RESPONSIVE ── */

/* ── HAMBURGER BUTTON ── */
.hamburger{display:none;position:fixed;top:10px;left:10px;z-index:2000;background:var(--primary);border:none;border-radius:8px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.2)}

/* ── SIDEBAR OVERLAY ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1500}
.sidebar-overlay.open{display:block}

@media(max-width:700px){
  /* Login */
  .login-card{width:92%;padding:28px 20px;margin:16px}

  /* Hamburger visible */
  .hamburger{display:flex}

  /* Sidebar becomes slide-in drawer */
  .sidebar{
    position:fixed;top:0;left:-240px;height:100vh;width:220px;
    z-index:1600;transition:left .25s ease;box-shadow:4px 0 20px rgba(0,0,0,0.25)
  }
  .sidebar.open{left:0}

  /* Main area takes full width */
  #app.visible{flex-direction:column}
  .main-area{width:100%;overflow:hidden}

  /* Topbar */
  .topbar{padding:0 12px 0 56px;height:50px;gap:8px}
  .topbar-title{font-size:14px}
  .topbar-time{font-size:11px;padding:3px 8px}

  /* Content */
  .content{padding:14px}

  /* Grids */
  .three-col,.two-col,.inv-cards,.four-col{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}

  /* Panels */
  .panel{padding:14px}

  /* Modal */
  .modal{width:92%;padding:20px 16px;margin:0 auto;max-height:90vh}

  /* Tables - horizontal scroll */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:500px}

  /* Client row stacking */
  .client-row{flex-wrap:wrap}
  .cactions{width:100%;margin-top:8px}

  /* Metric values slightly smaller */
  .metric-value{font-size:22px}

  /* Buttons */
  .btn{padding:8px 14px}
  .btn-block{width:100%}

  /* Page header */
  .page-header h2{font-size:17px}
}
</style>
</head>

<!-- ════════ MODAL ════════ -->

      <button class="modal-close" onclick="closeModal()">✕</button>

</div>

function setRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach((t,i)=>t.classList.remove('active'));
  document.querySelectorAll('.role-tab')[['staff','to','client'].indexOf(role)].classList.add('active');
  const hints = {
    staff:'Username: <strong>staff1</strong> &nbsp;|&nbsp; Password: <strong>pass123</strong>',
    to:'Username: <strong>to1</strong> &nbsp;|&nbsp; Password: <strong>pass123</strong>',
    client:'Username: <strong>client1</strong> &nbsp;|&nbsp; Password: <strong>pass123</strong>'
  };
  document.getElementById('demo-hint').innerHTML = '<strong>Demo credentials:</strong><br>' + hints[role];
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  const user = (USERS[currentRole]||[]).find(x=>x.username===u && x.password===p);
  if (!user) { document.getElementById('login-error').style.display='block'; return; }
  currentUser = user;
  document.getElementById('login-error').style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('visible');
  initApp();
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}

function initApp() {

function buildNav() {

  let html = '<div class="nav-group-label">Menu</div>';

  });

function navigateTo(pageId) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nav = document.getElementById('nav-'+pageId);
  if (nav) nav.classList.add('active');
  const labels = {};
  [...NAV_STAFF,...NAV_TO,...NAV_CLIENT].forEach(n=>labels[n.id]=n.label);
  document.getElementById('topbar-title').textContent = labels[pageId]||pageId;
  renderPage(pageId);

function calcFX() {
  const amt = parseFloat(document.getElementById('fx-amt').value);
  const from = document.getElementById('fx-from').value;
  const to = document.getElementById('fx-to').value;
  const errEl = document.getElementById('fx-err');
  const resEl = document.getElementById('fx-result');
  errEl.style.display='none'; resEl.style.display='none';
  if (!amt || isNaN(amt)) return;
  if (amt < 300) { errEl.textContent=`Minimum transaction is 300 ${from}.`; errEl.style.display='block'; return; }
  if (amt > 5000) { errEl.textContent=`Maximum transaction is 5,000 ${from}.`; errEl.style.display='block'; return; }
  if (from===to) { errEl.textContent='From and To currencies must be different.'; errEl.style.display='block'; return; }
  const rate = FX_RATES[to]/FX_RATES[from];
  const gross = amt*rate;
  const fr = feeRate(amt);
  const fee = gross*fr;
  const net = gross-fee;
  document.getElementById('r-amt').textContent = fmtCur(amt,from);
  document.getElementById('r-rate').textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
  document.getElementById('r-gross').textContent = fmtCur(gross,to);
  document.getElementById('r-feepc').textContent = (fr*100).toFixed(1)+'%';
  document.getElementById('r-fee').textContent = '− '+fmtCur(fee,to);
  document.getElementById('r-net').textContent = fmtCur(net,to);
  resEl.style.display='block';
  resEl.dataset.from=from; resEl.dataset.to=to; resEl.dataset.amt=amt; resEl.dataset.net=net.toFixed(2);
}

function calcSavings(mode) {
  const lump = parseFloat(document.getElementById('sv-lump').value)||0;

  if (plan.minLump && lump>0 && lump<plan.minLump) { errEl.textContent=`Minimum lump sum for this plan is £${plan.minLump}.`; errEl.style.display='block'; return; }
  if (monthly && monthly<plan.minMonthly) { errEl.textContent=`Minimum monthly contribution is £${plan.minMonthly}.`; errEl.style.display='block'; return; }
  const proj = calcProjection(plan, lump, monthly);

function calcProjection(plan, lump, monthly) {
  return [1,5,10].map(years=>{
    function proj(rate) {
      let val = lump, fees = 0;
      const months = years*12;
      for (let m=0;m<months;m++) {
        val += monthly;
        const mFee = val*plan.fee;
        fees += mFee;
        val = val*(1+rate/12)-mFee;
      }
      const invested = lump+monthly*months;
      const profit = Math.max(0,val-invested);
      const tax = calcTax(profit, plan);
      return {val, profit, fees, tax};
    }
    return {years, lo:proj(plan.minR), hi:proj(plan.maxR)};
  });
}

function calcTax(profit, plan) {
  if (!plan.tax1) return 0;
  let t = 0;
  if (plan.taxThr1 && profit > plan.taxThr1) {
    const band1 = plan.taxThr2 ? Math.min(profit, plan.taxThr2)-plan.taxThr1 : profit-plan.taxThr1;
    t += Math.max(0,band1)*plan.tax1;
  }
  if (plan.tax2 && plan.taxThr2 && profit > plan.taxThr2) {
    t += (profit-plan.taxThr2)*plan.tax2;
  }
  return t;
}

      <div class="field"><label>Confirm new password</label><input type="password" placeholder="Confirm new password"></div>
      <button class="btn btn-primary btn-block" onclick="alert('Password changed successfully.')">Change Password</button>
      <div style="margin-top:20px" class="panel-title">🔔 Preferences</div>
      <div class="field"><label>Language</label><select><option>English (UK)</option><option>Welsh</option></select></div>
      <div class="field"><label>Currency display</label><select><option>GBP (£)</option><option>USD ($)</option><option>EUR (€)</option></select></div>
      <button class="btn btn-outline btn-block" onclick="alert('Preferences saved.')">Save Preferences</button>
    </div>
  </div>`;
}

// ════════════════════════════════════════
// MODALS: VIEW / EDIT CLIENT
// ════════════════════════════════════════
function viewClient(id) {
  const c = CLIENTS.find(x=>x.id===id);
  if (!c) return;
  openModal('Client Details: '+c.name, `
    <div class="profile-header" style="margin-bottom:16px">
      <div class="cav" style="width:50px;height:50px;font-size:16px;background:${statusColor(c.status).bg};color:${statusColor(c.status).fg}">${initials(c.name)}</div>
      <div><div class="profile-name">${c.name}</div><div class="profile-role">${c.plan}</div></div>
    </div>
    <div class="result-box">
      <div class="result-row"><span class="result-label">Email</span><span class="result-val">${c.email}</span></div>
      <div class="result-row"><span class="result-label">Phone</span><span class="result-val">${c.phone}</span></div>
      <div class="result-row"><span class="result-label">Status</span><span class="pill pill-${c.status}">${c.status}</span></div>
      <div class="result-row"><span class="result-label">Monthly investment</span><span class="result-val">£${c.monthly}/mo</span></div>
      <div class="result-row"><span class="result-label">Initial lump sum</span><span class="result-val">${c.lump?'£'+c.lump.toLocaleString():'N/A'}</span></div>
      <div class="result-row"><span class="result-label">Joined</span><span class="result-val">${c.joinDate}</span></div>
      <div class="result-row"><span class="result-label">Notes</span><span class="result-val">${c.notes}</span></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-primary" onclick="closeModal();editClient('${c.id}')">Edit Client</button>
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
    </div>`);
}

function editClient(id) {
  const c = CLIENTS.find(x=>x.id===id);
  if (!c) return;
  const planOpts = INV_PLANS.map(p=>`<option ${p.name===c.plan?'selected':''}>${p.name}</option>`).join('');
  const statusOpts = ['active','pending','review'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('');
  openModal('Edit Client: '+c.name, `
    <div class="field"><label>Full name</label><input type="text" id="ec-name" value="${c.name}"></div>
    <div class="field"><label>Email</label><input type="email" id="ec-email" value="${c.email}"></div>
    <div class="field"><label>Phone</label><input type="tel" id="ec-phone" value="${c.phone}"></div>
    <div class="field"><label>Investment plan</label><select id="ec-plan">${planOpts}</select></div>
    <div class="two-col">
      <div class="field"><label>Lump sum (£)</label><input type="number" id="ec-lump" value="${c.lump}"></div>
      <div class="field"><label>Monthly (£)</label><input type="number" id="ec-monthly" value="${c.monthly}"></div>
    </div>
    <div class="field"><label>Status</label><select id="ec-status">${statusOpts}</select></div>
    <div class="field"><label>Notes</label><textarea id="ec-notes">${c.notes}</textarea></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" onclick="saveClient('${c.id}')">Save Changes</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
}

function saveClient(id) {
  const c = CLIENTS.find(x=>x.id===id);
  if (!c) return;
  c.name=document.getElementById('ec-name').value;
  c.email=document.getElementById('ec-email').value;
  c.phone=document.getElementById('ec-phone').value;
  c.plan=document.getElementById('ec-plan').value;
  c.lump=parseFloat(document.getElementById('ec-lump').value)||0;
  c.monthly=parseFloat(document.getElementById('ec-monthly').value)||0;
  c.status=document.getElementById('ec-status').value;
  c.notes=document.getElementById('ec-notes').value;
  closeModal();
  alert('Client updated successfully!');
  const current = document.querySelector('.nav-item.active');
  if (current) current.click();
}

function openAddClient() {
  const planOpts = INV_PLANS.map(p=>`<option>${p.name}</option>`).join('');
  openModal('Add New Client', `
    <div class="field"><label>Full name</label><input type="text" id="nc-name" placeholder="e.g. Jane Smith"></div>
    <div class="field"><label>Email</label><input type="email" id="nc-email" placeholder="email@example.com"></div>
    <div class="field"><label>Phone</label><input type="tel" id="nc-phone" placeholder="07xxx xxx xxx"></div>
    <div class="field"><label>Investment plan</label><select id="nc-plan">${planOpts}</select></div>
    <div class="two-col">
      <div class="field"><label>Lump sum (£)</label><input type="number" id="nc-lump" value="0"></div>
      <div class="field"><label>Monthly (£)</label><input type="number" id="nc-monthly" value="50"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="nc-notes" placeholder="Any relevant notes..."></textarea></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" onclick="addClient()">Add Client</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
}

function addClient() {
  const name = document.getElementById('nc-name').value.trim();
  if (!name) { alert('Please enter a client name.'); return; }
  const newClient = {
    id:'c'+Date.now(),
    name, email:document.getElementById('nc-email').value,
    phone:document.getElementById('nc-phone').value,
    plan:document.getElementById('nc-plan').value,
    lump:parseFloat(document.getElementById('nc-lump').value)||0,
    monthly:parseFloat(document.getElementById('nc-monthly').value)||0,
    status:'pending', notes:document.getElementById('nc-notes').value,
    joinDate:new Date().toISOString().slice(0,10)
  };
  CLIENTS.push(newClient);
  closeModal();
  alert('Client '+name+' added successfully!');
}

// ════════════════════════════════════════
// MODALS: STAFF MANAGEMENT
// ════════════════════════════════════════
function openAddStaff() {
  openModal('Add Staff Member', `
    <div class="field"><label>Full name</label><input type="text" id="ns-name" placeholder="e.g. Jane Smith"></div>
    <div class="field"><label>Email</label><input type="email" id="ns-email" placeholder="email@enomy.com"></div>
    <div class="field"><label>Role</label><select id="ns-role"><option>Financial Advisor</option><option>Investment Analyst</option><option>Client Manager</option><option>Compliance Officer</option></select></div>
    <div class="field"><label>Username</label><input type="text" id="ns-username" placeholder="e.g. jsmith"></div>
    <div class="field"><label>Temporary password</label><input type="password" id="ns-pass" placeholder="Set initial password"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" onclick="addStaff()">Add Staff</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
}

function addStaff() {
  const name = document.getElementById('ns-name').value.trim();
  if (!name) { alert('Please enter a name.'); return; }
  const newStaff = {
    id:'s'+Date.now(), name,
    email:document.getElementById('ns-email').value,
    role:document.getElementById('ns-role').value,
    username:document.getElementById('ns-username').value,
    status:'active', clients:0
  };
  STAFF_LIST.push(newStaff);
  USERS.staff.push({id:newStaff.id, username:newStaff.username, password:document.getElementById('ns-pass').value||'pass123', name, role:'staff', initials:initials(name), color:'#2557a7'});
  closeModal();
  alert('Staff member '+name+' added successfully!');
  renderTOStaff();
}

function editStaff(id) {
  const s = STAFF_LIST.find(x=>x.id===id);
  if (!s) return;
  openModal('Edit Staff: '+s.name, `
    <div class="field"><label>Full name</label><input type="text" id="es-name" value="${s.name}"></div>
    <div class="field"><label>Email</label><input type="email" id="es-email" value="${s.email}"></div>
    <div class="field"><label>Role</label><input type="text" id="es-role" value="${s.role}"></div>
    <div class="field"><label>Status</label><select id="es-status"><option ${s.status==='active'?'selected':''}>active</option><option ${s.status==='inactive'?'selected':''}>inactive</option></select></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" onclick="saveStaff('${s.id}')">Save</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
}

function saveStaff(id) {
  const s = STAFF_LIST.find(x=>x.id===id);
  if (!s) return;
  s.name=document.getElementById('es-name').value;
  s.email=document.getElementById('es-email').value;
  s.role=document.getElementById('es-role').value;
  s.status=document.getElementById('es-status').value;
  closeModal(); renderTOStaff();
}

function removeStaff(id) {
  if (!confirm('Remove this staff member?')) return;
  const idx = STAFF_LIST.findIndex(s=>s.id===id);
  if (idx>-1) STAFF_LIST.splice(idx,1);
  renderTOStaff();
}

// ════════════════════════════════════════
// MODAL HELPERS
// ════════════════════════════════════════
function openModal(title, body) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click',function(e){ if(e.target===this)closeModal(); });

// ════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════
function feeRate(amount) {
  if (amount<=500) return 0.035;
  if (amount<=1500) return 0.027;
  if (amount<=2500) return 0.020;
  return 0.015;
}
function fmtCur(v, cur) { return FX_SYMBOLS[cur]+Number(v.toFixed(2)).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtGBP(v) { return '£'+Math.round(v).toLocaleString('en-GB'); }
function currName(c) { return {GBP:'Pound Sterling',USD:'US Dollar',EUR:'Euro',BRL:'Brazilian Real',JPY:'Japanese Yen',TRY:'Turkish Lira'}[c]||c; }
function initials(name) { return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function statusColor(s) { return {active:{bg:'#e8f8ef',fg:'#1a6b3a'},pending:{bg:'#fff3dc',fg:'#7a4f00'},review:{bg:'#e8f0fb',fg:'#2557a7'}}[s]||{bg:'#eee',fg:'#333'}; }
function showAlert(id, msg) { const el=document.getElementById(id); if(el){el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',3000);} }

// Mobile sidebar toggle
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}
document.addEventListener('click', function(e) {
  if (window.innerWidth <= 700 && e.target.closest('.nav-item')) { closeSidebar(); }
});
</script>
